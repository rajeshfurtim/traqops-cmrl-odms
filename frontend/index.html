<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="ODMS — Operations for Chennai Metro Rail stations" />
    <title>ODMS · Chennai Metro Rail Limited</title>
    <script>
      // Resolve the theme before first paint to avoid a light flash. Mirrors src/utils/theme.ts.
      ;(function () {
        var pref = 'light'
        try {
          var stored = localStorage.getItem('odms.theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#151a21' : '#ffffff')
      })()
    </script>
  </head>

  <body>
    <div id="root">
      <div
        id="app-loader"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background-color: #ffffff;
          transition: background-color 0.2s;
        "
      >
        <style>
          [data-theme='dark'] #app-loader {
            background-color: #121820 !important;
          }
          [data-theme='dark'] #app-loader .cmrl-loader-logo {
            filter: brightness(0) invert(1);
          }
          [data-theme='dark'] #app-loader .cmrl-loader-track {
            border-color: rgba(255, 255, 255, 0.1) !important;
          }
          [data-theme='dark'] #app-loader .cmrl-loader-text {
            color: #94a3b8 !important;
          }
          @keyframes cmrl-spin {
            from {
              transform: rotate(0deg);
            }
            to {
              transform: rotate(360deg);
            }
          }
          .cmrl-outer-spinner {
            animation: cmrl-spin 0.9s linear infinite;
          }
        </style>
        <div
          style="
            position: relative;
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
          "
        >
          <div
            class="cmrl-loader-track"
            style="
              position: absolute;
              inset: 0;
              border-radius: 9999px;
              border: 3px solid #e2e8f0;
              box-sizing: border-box;
            "
          ></div>
          <div
            class="cmrl-outer-spinner"
            style="
              position: absolute;
              inset: 0;
              border-radius: 9999px;
              border: 3px solid transparent;
              border-top-color: #f59e0b;
              border-right-color: #102a43;
              box-sizing: border-box;
            "
          ></div>
          <img
            class="cmrl-loader-logo"
            src="/favicon.png"
            alt="CMRL"
            width="40"
            height="40"
            style="width: 40px; height: 40px; object-fit: contain; user-select: none"
          />
        </div>
        <div
          class="cmrl-loader-text"
          style="
            font-family:
              system-ui,
              -apple-system,
              sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #64748b;
          "
        >
          Loading ODMS…
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
