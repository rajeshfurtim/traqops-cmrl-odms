#server
spring.application.name=TraqopsOdms
server.port=8083
spring.jpa.hibernate.ddl-auto=update

#postgres db
spring.datasource.url=jdbc:postgresql://localhost:5432/odms_local
spring.datasource.username=postgres
spring.datasource.password=postgres


# Mail Setting
spring.mail.username=support@traqops.com
spring.mail.properties.mail.smtp.from=support@traqops.com
mail.header=TraqOps <${spring.mail.username}>
mail.noreply=No-REPLY <${spring.mail.username}>
spring.mail.password=Ftis4win2!
spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
mail.admin=support@traqops.com


spring.jpa.open-in-view=false
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss
spring.mvc.format.time=HH:mm

# JWT (set JWT_SECRET in every deployed environment; at least 32 characters)
jwt.secret=${JWT_SECRET:odms-local-development-secret-change-me-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS (comma-separated; the ODMS frontend dev server runs on 3002)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3002,http://localhost:3000}

## File Storage Properties
# Storage type: 'local' for local filesystem or 's3' for AWS S3
file.storage-type=${FILE_STORAGE_TYPE:local}
file.uploadDir=${FILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# AWS S3 Configuration (required if storage-type is 's3')
file.s3-bucket-name=${FILE_S3_BUCKET:}
file.s3-region=${FILE_S3_REGION:ap-south-1}
file.s3-access-key=${FILE_S3_ACCESS_KEY:}
file.s3-secret-key=${FILE_S3_SECRET_KEY:}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.org.hibernate.orm.connections.pooling=WARN
